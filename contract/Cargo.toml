[package]
name = "outwit-vault"
version = "0.1.0"
edition = "2021"
description = "Outwit vault: an AI agent proposes payments, a guard approves them, the contract enforces hard limits"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
