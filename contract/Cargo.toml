[package]
name = "leash-vault"
version = "0.1.0"
edition = "2021"
description = "Leash vault: on-chain spending limits and a kill switch for AI agents on NEAR"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
