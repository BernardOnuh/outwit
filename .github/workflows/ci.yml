name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      # rustup reads the pinned toolchain from contract/rust-toolchain.toml.
      - run: rustup show
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: outwit_vault.wasm
          path: contract/target/wasm32-unknown-unknown/release/outwit_vault.wasm
